app = "oliv-bot-rizki"
primary_region = "sin"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  # TELEGRAM_TOKEN and GEMINI_API_KEY must NOT be hardcoded here — they were
  # previously committed in plaintext, which leaked them into git history.
  # Set them with `fly secrets set TELEGRAM_TOKEN=... GEMINI_API_KEY=...`
  # instead, and revoke/rotate the old exposed values (BotFather / AI Studio).
  WEBHOOK_URL = "https://oliv-bot-rizki.fly.dev"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
